{% extends "base.html" %}
{% block content %}
<h1 class="mb-4">Останні попередження</h1>
<table class="table table-striped" id="alerts-table">
  <thead>
    <tr>
      <th>Час</th>
      <th>Хост</th>
      <th>Повідомлення</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>
{% endblock %}

{% block scripts %}
<script>
  async function loadAlerts() {
    const response = await fetch('/api/v1/alerts');
    const data = await response.json();
    const tbody = document.querySelector('#alerts-table tbody');
    tbody.innerHTML = '';
    data.alerts.forEach(alert => {
      const row = document.createElement('tr');
      const timeCell = document.createElement('td');
      timeCell.textContent = new Date(alert.timestamp * 1000).toLocaleString();
      const hostCell = document.createElement('td');
      hostCell.textContent = alert.host;
      const messageCell = document.createElement('td');
      messageCell.textContent = alert.message;
      row.appendChild(timeCell);
      row.appendChild(hostCell);
      row.appendChild(messageCell);
      tbody.appendChild(row);
    });
  }

  loadAlerts();
  setInterval(loadAlerts, 10000);
</script>
{% endblock %}
